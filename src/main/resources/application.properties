spring.application.name=tournament-prediction-api

# Container port. Override with SERVER_PORT if a deployment needs a different one.
server.port=8000

# Health probes: /actuator/health/liveness and /actuator/health/readiness,
# also served on the main port as /livez and /readyz.
# Readiness includes the database so traffic isn't routed while it's unreachable.
management.endpoint.health.probes.enabled=true
management.endpoint.health.probes.add-additional-paths=true
management.endpoint.health.group.readiness.include=readinessState,db

# Comma-separated list of origins allowed to call the API from a browser (e.g. the UI).
# Empty by default, which means no cross-origin requests are allowed.
cors.allowed-origins=${CORS_ORIGINS:}
