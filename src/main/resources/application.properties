spring.application.name=tournament-prediction-api

# Container port. Override with SERVER_PORT if a deployment needs a different one.
server.port=8000

# Health probes: /actuator/health/liveness and /actuator/health/readiness,
# also served on the main port as /livez and /readyz.
# Readiness includes the database so traffic isn't routed while it's unreachable.
management.endpoint.health.probes.enabled=true
management.endpoint.health.probes.add-additional-paths=true
management.endpoint.health.group.readiness.include=readinessState,db

# Comma-separated list of origins allowed to call the API from a browser (e.g. the UI).
# Empty by default, which means no cross-origin requests are allowed.
cors.allowed-origins=${CORS_ORIGINS:}

# Keycloak. Requests need an access token from this realm, addressed to the predictor-api audience.
# The defaults match the local Keycloak in the deployment repo's docker compose; deployments override
# them with SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI and ..._JWK_SET_URI.
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8180/realms/predictor
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${spring.security.oauth2.resourceserver.jwt.issuer-uri}/protocol/openid-connect/certs
spring.security.oauth2.resourceserver.jwt.audiences=predictor-api

# Swagger UI's "Authorize" button logs in through Keycloak as the UI client, using PKCE.
springdoc.swagger-ui.oauth.client-id=predictor-ui
springdoc.swagger-ui.oauth.use-pkce-with-authorization-code-grant=true
springdoc.swagger-ui.oauth.scopes=openid
